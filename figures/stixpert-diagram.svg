<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-labelledby="dt dd">
<title id="dt">StiXpert architecture</title>
<desc id="dd">Selected source trees are statically parsed into a knowledge base inside StiXpert. StiXpert's tools expose retrieval and workflow guidance to an AI client, which a researcher uses to refine questions and decide whether to proceed to analysis.</desc>
<style>
@import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&amp;family=Manrope:wght@800&amp;display=swap");
.dl{font:700 15px "DM Sans",Arial,sans-serif;fill:#182d49}
.ds{font:12px "DM Sans",Arial,sans-serif;fill:#63748a}
.dm{font:600 13px "DM Sans",Arial,sans-serif;fill:#182d49}
.dz{font:700 14px "DM Sans",Arial,sans-serif;fill:#3689b9}
.dcore{font:800 19px Manrope,"DM Sans",Arial,sans-serif;fill:#101d35}
</style>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#4c9dc5" stroke-width="1.3"/></marker></defs>
<rect width="1000" height="430" fill="#fff"/>
<path d="M705 20V350" fill="none" stroke="#9fb4c8" stroke-width="1.3" stroke-dasharray="2 5"/>
<rect x="20" y="20" width="340" height="326" rx="13" fill="#edf8fa" stroke="#a8dce3" stroke-width="1.5"/>
<text class="dl" x="190" y="46" text-anchor="middle">Indexed sources</text>
<rect x="36" y="60" width="308" height="62" rx="8" fill="#fff" stroke="#c4d7e7"/><text class="dm" x="50" y="82">Python sources</text><text class="ds" x="50" y="100">stixpy, stixdcpy, sunkit-spex, solo-epd-loader</text><text class="ds" x="50" y="115">with selected examples and documentation</text>
<rect x="36" y="130" width="308" height="62" rx="8" fill="#fff" stroke="#c4d7e7"/><text class="dm" x="50" y="152">SSWIDL routines</text><text class="ds" x="50" y="170">with configuration and text data;</text><text class="ds" x="50" y="185">spans multiple solar instruments</text>
<rect x="36" y="200" width="308" height="62" rx="8" fill="#fff" stroke="#c4d7e7"/><text class="dm" x="50" y="222">STIX Data Center</text><text class="ds" x="50" y="240">selected browser scripts; descriptions of</text><text class="ds" x="50" y="255">public routes and their parameters</text>
<rect x="36" y="270" width="308" height="62" rx="8" fill="#fff" stroke="#c4d7e7"/><text class="dm" x="50" y="292">Scientific context</text><text class="ds" x="50" y="310">indexed context on solar physics</text><text class="ds" x="50" y="325">and Solar Orbiter</text>
<rect x="420" y="20" width="240" height="326" rx="16" fill="#e6f2fb" stroke="#2e78c7" stroke-width="2"/>
<text class="dcore" x="540" y="50" text-anchor="middle">StiXpert</text>
<rect x="436" y="78" width="208" height="104" rx="10" fill="#fff" stroke="#c4d7e7" stroke-width="1.5"/><text class="dl" x="540.0" y="104" text-anchor="middle">Knowledge base</text><text class="ds" x="540.0" y="126" text-anchor="middle">Searchable records from selected</text><text class="ds" x="540.0" y="142" text-anchor="middle">source trees, parsed statically;</text><text class="ds" x="540.0" y="158" text-anchor="middle">code is not imported or executed</text>
<rect x="436" y="222" width="208" height="104" rx="10" fill="#fff" stroke="#c4d7e7" stroke-width="1.5"/><text class="dl" x="540.0" y="248" text-anchor="middle">Tools</text><text class="ds" x="540.0" y="270" text-anchor="middle">Retrieval tools to search and</text><text class="ds" x="540.0" y="286" text-anchor="middle">inspect indexed material,</text><text class="ds" x="540.0" y="302" text-anchor="middle">plus workflow guidance</text>
<rect x="750" y="224" width="230" height="100" rx="14" fill="#f0f4fb" stroke="#b9cbe2" stroke-width="1.5"/><text class="dcore" x="865.0" y="258" text-anchor="middle">AI client</text><text class="ds" x="865.0" y="282" text-anchor="middle">Compatible client;</text><text class="ds" x="865.0" y="300" text-anchor="middle"></text>
<rect x="750" y="70" width="230" height="116" rx="14" fill="#f0f4fb" stroke="#b9cbe2" stroke-width="1.5"/><text class="dcore" x="865.0" y="100" text-anchor="middle">Researcher</text><text class="ds" x="865.0" y="124" text-anchor="middle">Refines the question and decides</text><text class="ds" x="865.0" y="142" text-anchor="middle">whether to proceed to an analysis</text><text class="ds" x="865.0" y="160" text-anchor="middle">workflow and code; verifies results</text>
<g fill="none" stroke="#4c9dc5" stroke-width="2">
<path d="M360 130H434" marker-end="url(#ar)"/>
<path d="M540 182V220" marker-end="url(#ar)"/>
<path d="M660 274H748" stroke-dasharray="6 5" marker-start="url(#ar)" marker-end="url(#ar)"/>
<path d="M865 186V222" marker-start="url(#ar)" marker-end="url(#ar)"/>
</g>
<text class="dz" x="340" y="378" text-anchor="middle">STIX data center service</text>
<text class="dz" x="865" y="378" text-anchor="middle">client side</text>
</svg>
